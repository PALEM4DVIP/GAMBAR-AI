<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GAMBAR</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32">
<link rel="icon" type="image/png" href="favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
<style>
  :root{
    --bg:#0A0A12; --bg-2:#0D0D16; --panel:#111020; --border:#1E1E2C; --border-soft:#232135;
    --text:#F1EFFA; --text-dim:#9C99B4; --text-mute:#6E6C82;
    --g1:#8B7CFF; --g2:#37D6C4; --g3:#FF5FB0;
    --grad: linear-gradient(135deg, var(--g1), var(--g2), var(--g3));
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;}
  .app{display:flex;height:100vh;overflow:hidden;}

  /* Sidebar */
  .sidebar{width:270px;flex-shrink:0;background:var(--bg-2);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:16px 12px;transition:margin-left .25s ease;}
  .sidebar.collapsed{margin-left:-270px;}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;font-family:'Space Grotesk',sans-serif;}
  .orb{width:30px;height:30px;border-radius:50%;background:#15121F;border:1px solid #33304A;
    display:flex;align-items:center;justify-content:center;animation:pulse 3s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(139,124,255,.25);}50%{box-shadow:0 0 0 6px rgba(55,214,196,.08);}}
  .brand-name{font-weight:700;font-size:16px;}
  .btn-new{display:flex;align-items:center;gap:8px;background:var(--panel);color:var(--text);
    border:1px solid var(--border-soft);border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:600;
    cursor:pointer;margin-bottom:10px;position:relative;overflow:hidden;}
  .btn-new:hover{border-color:var(--g2);}
  .search-box{margin-bottom:12px;}
  .search-box input{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:9px;
    padding:8px 10px;color:var(--text);font-size:12.5px;outline:none;}
  .search-box input:focus{border-color:var(--g1);}
  .conv-label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--text-mute);padding:0 8px 8px;}
  .conv-list{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;}
  .conv-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;font-size:13px;
    color:var(--text-dim);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;}
  .conv-item:hover{background:#15131F;}
  .conv-item.active{background:#15131F;color:var(--text);border:1px solid var(--border-soft);}
  .conv-item .conv-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .conv-del{opacity:0;font-size:14px;color:var(--text-mute);cursor:pointer;padding:2px 4px;}
  .conv-item:hover .conv-del{opacity:1;}
  .conv-del:hover{color:#FF5FB0;}
  .sidebar-footer{border-top:1px solid var(--border);padding-top:10px;margin-top:8px;}
  .settings-btn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:13px;
    color:var(--text-dim);cursor:pointer;}
  .settings-btn:hover{background:#15131F;}

  /* Main */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);}
  .icon-btn{width:34px;height:34px;border-radius:9px;background:transparent;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;}
  .icon-btn:hover{background:var(--panel);}
  .model-badge{font-size:12px;color:var(--text-dim);background:var(--panel);border:1px solid var(--border-soft);
    padding:5px 10px;border-radius:20px;cursor:pointer;}

  .chat-area{flex:1;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;gap:16px;}
  .empty{margin:auto;text-align:center;max-width:480px;}
  .empty h1{font-size:22px;font-weight:700;margin:0 0 8px;font-family:'Space Grotesk',sans-serif;}
  .empty p{font-size:14px;color:var(--text-mute);margin:0 0 20px;}
  .sugg-grid{display:flex;flex-direction:column;gap:8px;}
  .sugg-card{text-align:left;background:var(--panel);border:1px solid var(--border-soft);border-radius:12px;
    padding:12px 14px;font-size:13px;color:#D6D4E6;cursor:pointer;transition:transform .15s,border-color .15s;}
  .sugg-card:hover{border-color:var(--g2);transform:translateY(-1px);}

  .msg-row{display:flex;gap:10px;align-items:flex-start;max-width:820px;width:100%;margin:0 auto;}
  .avatar{width:28px;height:28px;border-radius:50%;background:#15121F;border:1px solid #33304A;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;margin-top:2px;}
  .bubble{border-radius:14px;padding:12px 15px;font-size:14.5px;line-height:1.65;max-width:74%;}
  .bubble.assistant{background:var(--panel);border:1px solid var(--border-soft);}
  .bubble.user{margin-left:auto;background:linear-gradient(135deg, rgba(139,124,255,.18), rgba(55,214,196,.14), rgba(255,95,176,.16));
    border:1px solid var(--border-soft);}
  .bubble p{margin:0 0 10px;} .bubble p:last-child{margin-bottom:0;}
  .bubble pre{background:#0B0A14;border:1px solid var(--border-soft);border-radius:10px;padding:12px;overflow-x:auto;font-size:13px;}
  .bubble code{font-family:'Consolas',monospace;}
  .bubble ul,.bubble ol{padding-left:20px;margin:0 0 10px;}
  .row-assistant{justify-content:flex-start;} .row-user{justify-content:flex-end;}

  .typing-dot{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;
    background:linear-gradient(135deg,var(--g1),var(--g2));animation:bounce 1.2s infinite ease-in-out;}
  .typing-dot:nth-child(2){animation-delay:.15s;} .typing-dot:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5;}30%{transform:translateY(-4px);opacity:1;}}

  .composer-wrap{padding:10px 20px 16px;}
  .composer{max-width:820px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:var(--panel);
    border-radius:16px;padding:8px 8px 8px 16px;border:1px solid var(--border-soft);position:relative;}
  .composer:focus-within{border-color:var(--g2);}
  .composer textarea{flex:1;background:transparent;border:none;outline:none;resize:none;color:var(--text);
    font-size:14px;font-family:inherit;padding:8px 0;max-height:160px;}
  .composer textarea::placeholder{color:var(--text-mute);}
  .send-btn{width:36px;height:36px;border-radius:10px;background:#1B1930;border:1px solid var(--border-soft);
    cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .send-btn:disabled{opacity:.4;cursor:default;}
  .disclaimer{text-align:center;font-size:11px;color:var(--text-mute);margin-top:8px;}
  .err-bubble{color:#FF9E9E;}

  /* Settings modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(5,5,10,.65);display:none;align-items:center;justify-content:center;z-index:50;}
  .modal-backdrop.open{display:flex;}
  .modal{width:420px;max-width:90vw;background:var(--bg-2);border:1px solid var(--border-soft);border-radius:16px;padding:22px;}
  .modal h2{font-size:16px;margin:0 0 4px;font-family:'Space Grotesk',sans-serif;}
  .modal .sub{font-size:12.5px;color:var(--text-mute);margin:0 0 18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  .field input, .field select{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:9px;
    padding:9px 11px;color:var(--text);font-size:13px;outline:none;}
  .field input:focus, .field select:focus{border-color:var(--g1);}
  .key-row{display:flex;gap:6px;}
  .key-row input{flex:1;}
  .link-hint{font-size:11.5px;color:var(--text-mute);margin-top:6px;}
  .link-hint a{color:var(--g2);text-decoration:none;}
  .modal-actions{display:flex;gap:8px;margin-top:18px;}
  .btn-primary{flex:1;background:var(--grad);border:none;border-radius:10px;padding:10px;font-size:13.5px;
    font-weight:700;color:#0A0A12;cursor:pointer;}
  .btn-ghost{background:transparent;border:1px solid var(--border-soft);border-radius:10px;padding:10px 14px;
    font-size:13.5px;color:var(--text-dim);cursor:pointer;}

  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--border-soft);border-radius:8px;}

  @media(max-width:760px){
    .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:40;margin-left:-270px;}
    .sidebar.mobile-open{margin-left:0;}
    .bubble{max-width:88%;}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="orb"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2z" fill="url(#g1)"/></svg></div>
      <span class="brand-name">GAMBAR</span>
    </div>
    <button class="btn-new" id="newChatBtn">
      <svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="url(#g2)" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span>Obrolan baru</span>
    </button>
    <div class="search-box"><input type="text" id="searchInput" placeholder="Cari obrolan..." /></div>
    <div class="conv-label">Riwayat</div>
    <div class="conv-list" id="convList"></div>
    <div class="sidebar-footer">
      <div class="settings-btn" id="openSettingsBtn">
        <svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7z" stroke="url(#g3)" stroke-width="1.6"/><path d="M19.4 13a7.7 7.7 0 000-2l2-1.5-2-3.5-2.4.6a7.6 7.6 0 00-1.7-1L15 3h-4l-.3 2.6a7.6 7.6 0 00-1.7 1l-2.4-.6-2 3.5L6.6 11a7.7 7.7 0 000 2l-2 1.5 2 3.5 2.4-.6a7.6 7.6 0 001.7 1L11 21h4l.3-2.6a7.6 7.6 0 001.7-1l2.4.6 2-3.5-2-1.5z" stroke="url(#g3)" stroke-width="1.3" fill="none"/></svg>
        <span>Pengaturan</span>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Toggle sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke="url(#g1)" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="model-badge" id="modelBadge">gemini-3.5-flash</div>
      <button class="icon-btn" id="topSettingsBtn" aria-label="Pengaturan">
        <svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7z" stroke="url(#g2)" stroke-width="1.6"/></svg>
      </button>
    </div>

    <div class="chat-area" id="chatArea"></div>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Kirim pesan ke GAMBAR..."></textarea>
        <button class="send-btn" id="sendBtn" aria-label="Kirim">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 20l16-8L4 4l0 6.5L15 12 4 13.5 4 20z" fill="url(#g3)"/></svg>
        </button>
      </div>
      <p class="disclaimer">GAMBAR bisa saja keliru. Selalu cek info penting. Ditenagai Google Gemini API.</p>
    </div>
  </main>
</div>

<!-- Settings modal -->
<div class="modal-backdrop" id="settingsModal">
  <div class="modal">
    <h2>Pengaturan GAMBAR</h2>
    <p class="sub">Atur model dan gaya jawaban GAMBAR. API key sudah diatur oleh pengelola situs ini — kamu tidak perlu memasukkan apa pun.</p>
    <div class="field">
      <label>Model</label>
      <select id="modelSelect">
        <option value="gemini-3.5-flash">Gemini 3.5 Flash (rekomendasi, limit gratis paling lega)</option>
        <option value="gemini-3.6-flash">Gemini 3.6 Flash (terbaru, lebih pintar)</option>
        <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite (paling cepat &amp; ringan)</option>
      </select>
    </div>
    <div class="field">
      <label>Kreativitas (temperature): <span id="tempVal">0.9</span></label>
      <input type="range" id="tempInput" min="0" max="1.5" step="0.1" value="0.9" />
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" id="closeSettingsBtn">Tutup</button>
      <button class="btn-primary" id="saveSettingsBtn">Simpan</button>
    </div>
  </div>
</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8B7CFF"/><stop offset="50%" stop-color="#37D6C4"/><stop offset="100%" stop-color="#FF5FB0"/></linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8B7CFF"/><stop offset="50%" stop-color="#37D6C4"/><stop offset="100%" stop-color="#FF5FB0"/></linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8B7CFF"/><stop offset="50%" stop-color="#37D6C4"/><stop offset="100%" stop-color="#FF5FB0"/></linearGradient>
  </defs>
</svg>

<script>
const LS_CONVOS = 'aurora_conversations';
const LS_ACTIVE = 'aurora_active';
const LS_MODEL = 'aurora_model';
const LS_TEMP = 'aurora_temp';

let conversations = JSON.parse(localStorage.getItem(LS_CONVOS) || '[]');
let activeId = localStorage.getItem(LS_ACTIVE) || null;
const VALID_MODELS = ['gemini-3.5-flash', 'gemini-3.6-flash', 'gemini-3.5-flash-lite'];
let model = localStorage.getItem(LS_MODEL) || 'gemini-3.5-flash';
if (!VALID_MODELS.includes(model)) model = 'gemini-3.5-flash';
let temperature = parseFloat(localStorage.getItem(LS_TEMP) || '0.9');

const $ = (sel) => document.querySelector(sel);
const convList = $('#convList');
const chatArea = $('#chatArea');
const input = $('#input');
const sendBtn = $('#sendBtn');
const modelBadge = $('#modelBadge');

marked.setOptions({ breaks: true, highlight: (code, lang) => {
  try { return hljs.highlight(code, { language: lang || 'plaintext' }).value; } catch(e){ return code; }
}});

function escapeHtml(str){
  return str.replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function persist(){
  localStorage.setItem(LS_CONVOS, JSON.stringify(conversations));
  localStorage.setItem(LS_ACTIVE, activeId || '');
}

function newConversation(){
  const conv = { id: 'c' + Date.now(), title: 'Obrolan baru', messages: [] };
  conversations.unshift(conv);
  activeId = conv.id;
  persist();
  renderSidebar();
  renderMessages();
}

function getActive(){ return conversations.find(c => c.id === activeId); }

function deleteConversation(id, e){
  e.stopPropagation();
  conversations = conversations.filter(c => c.id !== id);
  if (activeId === id) activeId = conversations[0]?.id || null;
  persist();
  renderSidebar();
  renderMessages();
}

function renderSidebar(){
  const q = ($('#searchInput').value || '').toLowerCase();
  convList.innerHTML = '';
  conversations
    .filter(c => c.title.toLowerCase().includes(q))
    .forEach(c => {
      const div = document.createElement('div');
      div.className = 'conv-item' + (c.id === activeId ? ' active' : '');
      div.innerHTML = `<span class="conv-title"></span><span class="conv-del">✕</span>`;
      div.querySelector('.conv-title').textContent = c.title;
      div.addEventListener('click', () => { activeId = c.id; persist(); renderSidebar(); renderMessages(); });
      div.querySelector('.conv-del').addEventListener('click', (e) => deleteConversation(c.id, e));
      div.addEventListener('dblclick', () => {
        const t = prompt('Ganti nama obrolan:', c.title);
        if (t) { c.title = t; persist(); renderSidebar(); }
      });
      convList.appendChild(div);
    });
}

function bubbleHtml(role, content){
  const safe = role === 'user' ? `<p>${escapeHtml(content)}</p>` : marked.parse(content || '');
  return safe;
}

function renderMessages(){
  const conv = getActive();
  chatArea.innerHTML = '';
  if (!conv || conv.messages.length === 0){
    chatArea.innerHTML = `
      <div class="empty">
        <h1>Mau ngobrolin apa hari ini?</h1>
        <p>Tanya apa saja — ide, tulisan, kode, atau sekadar teman diskusi.</p>
        <div class="sugg-grid">
          <button class="sugg-card" data-s="Bantu aku brainstorming caption Instagram">Bantu aku brainstorming caption Instagram</button>
          <button class="sugg-card" data-s="Jelaskan konsep async/await di JavaScript">Jelaskan konsep async/await di JavaScript</button>
          <button class="sugg-card" data-s="Buatkan itinerary 3 hari di Jogja">Buatkan itinerary 3 hari di Jogja</button>
        </div>
      </div>`;
    chatArea.querySelectorAll('.sugg-card').forEach(btn => {
      btn.addEventListener('click', () => { input.value = btn.dataset.s; input.focus(); });
    });
    return;
  }
  conv.messages.forEach(m => {
    const row = document.createElement('div');
    row.className = 'msg-row row-' + m.role;
    if (m.role === 'assistant'){
      row.innerHTML = `<div class="avatar"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2z" fill="url(#g1)"/></svg></div>
        <div class="bubble assistant" id="${m.id || ''}">${bubbleHtml(m.role, m.content)}</div>`;
    } else {
      row.innerHTML = `<div class="bubble user">${bubbleHtml(m.role, m.content)}</div>`;
    }
    chatArea.appendChild(row);
  });
  chatArea.scrollTop = chatArea.scrollHeight;
}

function autoResize(){
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
}
input.addEventListener('input', autoResize);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});
sendBtn.addEventListener('click', sendMessage);
$('#newChatBtn').addEventListener('click', newConversation);
$('#searchInput').addEventListener('input', renderSidebar);

async function sendMessage(){
  const text = input.value.trim();
  if (!text) return;
  if (!getActive()) newConversation();

  const conv = getActive();
  conv.messages.push({ role: 'user', content: text });
  if (conv.messages.length === 1) conv.title = text.slice(0, 40);
  input.value = ''; autoResize();
  persist(); renderSidebar(); renderMessages();

  const assistantId = 'm' + Date.now();
  conv.messages.push({ role: 'assistant', content: '', id: assistantId });
  renderMessages();
  const bubbleEl = document.getElementById(assistantId);
  bubbleEl.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';

  const contents = conv.messages
    .filter(m => m.content !== '' || m.id !== assistantId)
    .filter(m => !(m.role === 'assistant' && m.id === assistantId))
    .map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] }));

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents, model, temperature })
    });

    if (!res.ok){
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData?.error || `HTTP ${res.status}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let fullText = '';
    let firstChunk = true;

    while (true){
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines){
        if (!line.startsWith('data: ')) continue;
        const jsonStr = line.slice(6).trim();
        if (!jsonStr) continue;
        try {
          const parsed = JSON.parse(jsonStr);
          const piece = parsed?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (piece){
            fullText += piece;
            if (firstChunk){ bubbleEl.innerHTML = ''; firstChunk = false; }
            bubbleEl.innerHTML = marked.parse(fullText);
            chatArea.scrollTop = chatArea.scrollHeight;
          }
        } catch(e) { /* skip malformed chunk */ }
      }
    }
    conv.messages.find(m => m.id === assistantId).content = fullText || '(tidak ada respons)';
    persist();
  } catch (err) {
    bubbleEl.innerHTML = `<span class="err-bubble">Gagal memanggil GAMBAR: ${escapeHtml(err.message || 'terjadi kesalahan')}. Coba lagi sebentar lagi.</span>`;
    conv.messages.find(m => m.id === assistantId).content = '';
  }
}

// Settings modal
const settingsModal = $('#settingsModal');
function openSettings(){
  $('#modelSelect').value = model;
  $('#tempInput').value = temperature;
  $('#tempVal').textContent = temperature;
  settingsModal.classList.add('open');
}
function closeSettings(){ settingsModal.classList.remove('open'); }
$('#openSettingsBtn').addEventListener('click', openSettings);
$('#topSettingsBtn').addEventListener('click', openSettings);
$('#closeSettingsBtn').addEventListener('click', closeSettings);
$('#modelBadge').addEventListener('click', openSettings);
$('#tempInput').addEventListener('input', (e) => $('#tempVal').textContent = e.target.value);
$('#saveSettingsBtn').addEventListener('click', () => {
  model = $('#modelSelect').value;
  temperature = parseFloat($('#tempInput').value);
  localStorage.setItem(LS_MODEL, model);
  localStorage.setItem(LS_TEMP, temperature);
  modelBadge.textContent = model;
  closeSettings();
});

// Mobile sidebar toggle
$('#menuBtn').addEventListener('click', () => {
  $('#sidebar').classList.toggle('mobile-open');
  $('#sidebar').classList.toggle('collapsed');
});

// Init
modelBadge.textContent = model;
if (conversations.length === 0) newConversation();
else { renderSidebar(); renderMessages(); }
</script>
</body>
</html>
